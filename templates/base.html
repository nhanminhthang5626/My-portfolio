<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thêm font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<!-- Đổi màu nền sang tối, chữ màu xám sáng -->
<body class="bg-slate-900 text-slate-300 selection:bg-cyan-500 selection:text-white">
    <div class="min-h-screen flex flex-col">

        <!-- phần header -->
        <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-700">
            <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center">
                <a class="flex title-font font-bold items-center text-white mb-4 md:mb-0 hover:text-cyan-400 transition-colors">
                    <img src="https://i.pinimg.com/736x/d3/3a/a1/d33aa191cea8ce59658acf1e63b002cd.jpg"
                        class="object-cover w-10 h-10 rounded-full border-2 border-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.5)]" alt="">
                    <span class="ml-3 text-xl tracking-wider">THANG<span class="text-cyan-400">.DEV</span></span>
                </a>
                <nav class="md:ml-auto flex flex-wrap items-center text-sm uppercase tracking-widest justify-center">
                    <a href="/about" class="mr-6 hover:text-cyan-400 transition-colors cursor-pointer">About me</a>
                    <a href="/" class="mr-6 hover:text-cyan-400 transition-colors cursor-pointer">Dự án</a>
                    <a class="mr-6 hover:text-cyan-400 transition-colors cursor-pointer">Liên hệ</a>
                    <a class="mr-6 hover:text-cyan-400 transition-colors cursor-pointer">Nhược điểm</a>
                </nav>
                <button
                    class="inline-flex items-center bg-cyan-500 text-slate-900 border-0 py-2 px-6 focus:outline-none hover:bg-cyan-400 hover:shadow-[0_0_15px_rgba(34,211,238,0.6)] rounded-full font-bold text-sm mt-4 md:mt-0 transition-all duration-300">
                    Hire Me
                    <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2" class="w-4 h-4 ml-1" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </header>
        <!-- hết phần header -->
        
        <main class="flex-grow">
            {% block content %}
            {% endblock %}
        </main>

        <!-- phần footer -->
        <footer class="text-slate-400 bg-slate-900 border-t border-slate-800 body-font mt-auto">
            <div class="container px-5 py-8 mx-auto flex items-center sm:flex-row flex-col">
                <a class="flex title-font font-medium items-center md:justify-start justify-center text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round" stroke-width="2"
                        class="w-10 h-10 text-slate-900 p-2 bg-cyan-500 rounded-full" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <span class="ml-3 text-xl">Tailblocks</span>
                </a>
                <p class="text-sm text-slate-500 sm:ml-4 sm:pl-4 sm:border-l-2 sm:border-slate-700 sm:py-2 sm:mt-0 mt-4">
                    © 2026 ThangDev —
                    <a href="https://twitter.com/knyttneve" class="text-slate-400 hover:text-cyan-400 ml-1 transition-colors" rel="noopener noreferrer"
                        target="_blank">@knyttneve</a>
                </p>
                <span class="inline-flex sm:ml-auto sm:mt-0 mt-4 justify-center sm:justify-start">
                    <a class="text-slate-500 hover:text-cyan-400 transition-colors cursor-pointer">
                        <svg fill="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            class="w-5 h-5" viewBox="0 0 24 24">
                            <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"></path>
                        </svg>
                    </a>
                    <a class="ml-3 text-slate-500 hover:text-cyan-400 transition-colors cursor-pointer">
                        <svg fill="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            class="w-5 h-5" viewBox="0 0 24 24">
                            <path
                                d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z">
                            </path>
                        </svg>
                    </a>
                    <a class="ml-3 text-slate-500 hover:text-cyan-400 transition-colors cursor-pointer">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2" class="w-5 h-5" viewBox="0 0 24 24">
                            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37zm1.5-4.87h.01"></path>
                        </svg>
                    </a>
                    <a class="ml-3 text-slate-500 hover:text-cyan-400 transition-colors cursor-pointer">
                        <svg fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="0" class="w-5 h-5" viewBox="0 0 24 24">
                            <path stroke="none"
                                d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z">
                            </path>
                            <circle cx="4" cy="4" r="2" stroke="none"></circle>
                        </svg>
                    </a>
                </span>
            </div>
        </footer>
        <!-- hết phần footer -->
    </div>
</body>

</html>
